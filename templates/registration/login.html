{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log In{% endblock title %}

{% block content %}
<h2 style="padding-top: 1rem; padding-bottom: 1rem; font-family: 'Avro', 'Poppins', 'Railway';">Log In</h2>
<form method="post">{% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-success ms-2" type="submit" style="background-color: #082434; color: #a6cbd3; border-style: none;">Log In</button>
</form>
{% endblock content %}
