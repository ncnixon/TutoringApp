{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up{% endblock title %}

{% block content %}
<h2 style="padding-top: 1rem; padding-bottom: 1rem; font-family: 'Avro', 'Poppins', 'Railway';">Sign Up</h2>
<form method="post" style="padding-bottom: 2rem;">{% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-success" type="submit" style="background-color: #082434; color: #a6cbd3; border-style: none;">Sign Up</button>
</form>
{% endblock content %}
